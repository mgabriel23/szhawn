<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				background-color: #fbf7f2;
				background-image:
					radial-gradient(
						120% 90% at 12% 6%,
						#f4e9f3 0%,
						rgba(244, 233, 243, 0) 58%
					),
					radial-gradient(
						110% 85% at 88% 12%,
						#e6f0f1 0%,
						rgba(230, 240, 241, 0) 55%
					),
					linear-gradient(
						165deg,
						#fdf9f5 0%,
						#f7f2fa 48%,
						#f1f7f3 100%
					);
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: "Cormorant Garamond", Georgia, serif;
				color: #4b4055;
				overflow: hidden;
				position: relative;
			}
			.content {
				text-align: center;
				z-index: 2;
				width: 700px;
			}
			.eyebrow {
				font-family: system-ui, sans-serif;
				font-size: 16px;
				font-weight: 700;
				letter-spacing: 0.3em;
				text-transform: uppercase;
				color: #b08f63;
				margin-bottom: 20px;
			}
			h1 {
				font-size: 58px;
				font-weight: 400;
				line-height: 1.2;
				margin: 0;
			}
			.divider {
				margin: 30px auto;
				width: 100px;
				height: 1px;
				background: #c6a87c;
			}
			.baby {
				position: absolute;
				bottom: -50px;
				right: 50px;
				width: 400px;
				filter: drop-shadow(0 15px 20px rgba(74, 63, 82, 0.15));
			}
		</style>
	</head>
	<body>
		<div class="content">
			<div class="eyebrow">Hello I'm Szhawn</div>
			<h1>I'm inviting you to a party!</h1>
			<div class="divider"></div>
			<p
				style="
					font-family: system-ui, sans-serif;
					color: #7a6e85;
					font-size: 18px;
				"
			>
				Baby Szhawn's 1st Birthday & Baptism · Dec 13, 2026
			</p>
		</div>
		<!-- Replace with your actual baby PNG file name -->
		<img src="baby-szhawn.png" class="baby" alt="Baby Szhawn" />
	</body>
</html>
